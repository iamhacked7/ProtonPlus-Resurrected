name: Build ProtonPlus + ReSukiSU + SUSFS (a52q)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (branch ksu-susfs)
        uses: actions/checkout@v4
        with:
          repository: notfleshka/ProtonPlus-Resurrected
          ref: ksu-susfs
          fetch-depth: 1

      - name: Pasang driver ReSukiSU (non-GKI, manual hook)
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"
          echo "cek SUSFS di driver (harus > 0):"
          grep -c "SUSFS" $(readlink -f drivers/kernelsu)/Kconfig || true
          ls $(readlink -f drivers/kernelsu) | head

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true

      - name: Aktifkan ReSukiSU + SUSFS
        run: |
          cat >> arch/arm64/configs/vendor/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF

      - name: Force build target ke a52q
        run: sed -i 's/^DO_A72Q=1/DO_A72Q=0/' ckbuild.sh

      - name: Build kernel (KSU + a52q)
        run: |
          chmod +x ckbuild.sh
          bash ckbuild.sh ka52

      - name: Verifikasi KSU & SUSFS aktif
        run: grep -E "CONFIG_KSU" out/.config || echo "!!! CONFIG_KSU TIDAK ADA !!!"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ProtonPlus-ReSukiSU-SUSFS-a52q
          path: ProtonPlus_Resurrected_*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
          if-no-files-found: ignore
