name: Build ProtonPlus v2 + ReSukiSU (a52q)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (ProtonKernel proton-v2)
        uses: actions/checkout@v4
        with:
          repository: ProtonKernel/ProtonPlus_a572q
          ref: proton-v2
          fetch-depth: 1

      - name: Info kernel
        run: sed -n '1,5p' Makefile

      - name: Pasang driver ReSukiSU
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"

      - name: Tambahkan manual hook ReSukiSU
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          G, E = "#ifdef CONFIG_KSU_MANUAL_HOOK", "#endif"
          def rd(p): return pathlib.Path(p).read_text(encoding="utf-8", errors="surrogateescape")
          def wr(p,s): pathlib.Path(p).write_text(s, encoding="utf-8", errors="surrogateescape")
          def add_extern(s, block):
              i = s.rfind("#include"); i = s.index("\n", i) + 1
              return s[:i] + "\n" + block + "\n" + s[i:]

          s = rd("fs/exec.c")
          s = add_extern(s, f"{G}\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\tvoid *argv, void *envp, int *flags);\n{E}")
          a = "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"
          j = s.index(a)
          s = s[:j] + f"{G}\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n{E}\n" + s[j:]
          wr("fs/exec.c", s); print("[OK] execveat")

          s = rd("fs/open.c")
          s = add_extern(s, f"{G}\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\tint *mode, int *flags);\n{E}")
          a = "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)"
          j = s.index("{", s.index(a)) + 1
          s = s[:j] + f"\n{G}\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n{E}" + s[j:]
          wr("fs/open.c", s); print("[OK] faccessat")

          s = rd("fs/stat.c")
          s = add_extern(s, f"{G}\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
            "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
            "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
            f"extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n{E}\n{E}")
          a = "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,"
          j = s.index("{", s.index(a)) + 1
          s = s[:j] + f"\n{G}\n\tksu_handle_stat(&dfd, &filename, &flag);\n{E}" + s[j:]
          for fn, call in [
            ("SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)", "ksu_handle_newfstat_ret(&fd, &statbuf);"),
            ("SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)", "ksu_handle_fstat64_ret(&fd, &statbuf);")]:
              k = s.index(fn); r = s.index("\n\treturn error;", k)
              s = s[:r] + f"\n{G}\n\t{call}\n{E}" + s[r:]
          wr("fs/stat.c", s); print("[OK] stat + newfstat_ret + fstat64_ret")

          s = rd("kernel/reboot.c")
          s = add_extern(s, f"{G}\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n{E}")
          a = "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,"
          j = s.index("{", s.index(a)) + 1
          s = s[:j] + f"\n{G}\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n{E}" + s[j:]
          wr("kernel/reboot.c", s); print("[OK] sys_reboot")
          PYEOF
          echo "=== verifikasi simbol wajib ==="
          for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" \
                      "fs/stat.c:ksu_handle_stat" "fs/stat.c:ksu_handle_newfstat_ret" \
                      "fs/stat.c:ksu_handle_fstat64_ret" "kernel/reboot.c:ksu_handle_sys_reboot"; do
            f=${pair%%:*}; sym=${pair##*:}; echo -n "  $sym: "; grep -c "$sym" "$f"
          done

      # ==================================================================
      # ptrace_guard - satu-satunya tambahan terhadap workflow aslimu.
      #
      # Menolak ptrace_attach() non-root terhadap proses tertentu, sehingga
      # watchdog anti-debug APSE (yang mem-fork anak untuk mem-ptrace
      # induknya sendiri) tidak bisa menempati kursi tracer. frida-server
      # berjalan sebagai root, jadi tetap diizinkan.
      #
      # MATI SECARA DEFAULT: target kosong = kernel identik dengan stock.
      # Aktifkan saat runtime, tanpa rebuild:
      #   echo id.bmri.satu > /sys/module/ptrace/parameters/guard_comm
      # ==================================================================
      - name: Tambahkan ptrace_guard (tolak ptrace non-root)
        run: |
          python3 - <<'PYEOF'
          import pathlib

          # Sengaja TIDAK dibungkus CONFIG_KSU_MANUAL_HOOK: tambalan ini
          # berdiri sendiri dan tidak bergantung pada driver KSU.
          p = pathlib.Path("kernel/ptrace.c")
          s = p.read_text(encoding="utf-8", errors="surrogateescape")

          if "ptrace_guard_comm" in s:
              raise SystemExit("!!! sudah pernah ditambal - hentikan agar tidak dobel")

          # Semua baris C dirakit sebagai daftar string Python yang ter-indentasi.
          # Kalau ditulis sebagai literal multi-baris, barisnya akan mulai di
          # kolom 0 dan keluar dari blok "run: |" sehingga YAML rusak.

          # 1) deklarasi + parameter runtime, disisipkan setelah blok #include
          i = s.rfind("#include")
          i = s.index("\n", i) + 1
          decl = "\n".join([
              "",
              "/* ptrace_guard: tolak ptrace non-root terhadap proses guard_comm.",
              " * Kosong = nonaktif (default), kernel identik dengan stock.",
              " * Atur saat runtime lewat /sys/module/ptrace/parameters/guard_comm",
              " */",
              "#include <linux/moduleparam.h>",
              "static char ptrace_guard_comm[TASK_COMM_LEN] = \"\";",
              "module_param_string(guard_comm, ptrace_guard_comm,",
              "                    sizeof(ptrace_guard_comm), 0644);",
              "MODULE_PARM_DESC(guard_comm,",
              "                 \"comm proses yang ditolak di-ptrace non-root\");",
              "",
          ])
          s = s[:i] + decl + s[i:]

          # 2) pemeriksaan di ptrace_attach(), SETELAH blok deklarasi.
          #
          # Kernel memakai -Wdeclaration-after-statement, jadi kode tidak boleh
          # disisipkan di tengah deklarasi. Struktur aslinya:
          #     bool seize = (request == PTRACE_SEIZE);
          #     int retval;
          #                        <- baris kosong = akhir blok deklarasi
          #     retval = -EIO;
          # Maka kita cari baris kosong pertama sesudah anchor dan menyisip
          # di situ. Cara ini tahan terhadap deklarasi tambahan maupun CRLF.
          anchor = "bool seize = (request == PTRACE_SEIZE);"
          if anchor not in s:
              raise SystemExit("!!! anchor ptrace_attach tidak ditemukan - "
                               "periksa kernel/ptrace.c secara manual")
          k = s.index(anchor)
          j = -1
          for sep in ("\n\r\n", "\n\n"):
              t = s.find(sep, k)
              if t != -1 and (j == -1 or t < j):
                  j = t + len(sep) - 1
          if j == -1:
              raise SystemExit("!!! akhir blok deklarasi ptrace_attach "
                               "tidak ditemukan")
          # Satu "" di depan dan satu di belakang -> menghasilkan baris kosong
          # pemisah di kedua sisi blok, sesuai gaya kernel.
          check = "\n".join([
              "",
              "\t/* ptrace_guard: hanya root yang boleh men-trace proses ini.",
              "\t * Watchdog anti-debug berjalan sebagai uid aplikasi -> tertolak.",
              "\t * frida-server berjalan sebagai root -> tetap diizinkan.",
              "\t */",
              "\tif (ptrace_guard_comm[0] &&",
              "\t    !strncmp(task->comm, ptrace_guard_comm, TASK_COMM_LEN) &&",
              "\t    !uid_eq(current_uid(), GLOBAL_ROOT_UID))",
              "\t\treturn -EPERM;",
              "",
          ])
          s = s[:j] + check + s[j:]

          p.write_text(s, encoding="utf-8", errors="surrogateescape")
          print("[OK] ptrace_guard ditambal ke kernel/ptrace.c")
          PYEOF

          echo "=== verifikasi tambalan ==="
          for sym in ptrace_guard_comm module_param_string GLOBAL_ROOT_UID; do
            echo -n "  $sym: "; grep -c "$sym" kernel/ptrace.c
          done
          echo "--- konteks di ptrace_attach ---"
          grep -n -B2 -A6 "ptrace_guard_comm\[0\]" kernel/ptrace.c

      - name: Buat vendor/ksu.config
        run: |
          cat > arch/arm64/configs/vendor/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          EOF
          cat arch/arm64/configs/vendor/ksu.config

      - name: Definisikan DO_A72Q + matikan upload bashupload
        run: |
          sed -i 's/^DO_A52Q=0/DO_A52Q=0\nDO_A72Q=0/' ckbuild.sh
          sed -i 's/^LOG_UPLOAD=1/LOG_UPLOAD=0/' ckbuild.sh
          grep -nE "^DO_A52Q=|^DO_A72Q=|^LOG_UPLOAD=" ckbuild.sh

      - name: Beri nama kernel (iamhacked)
        run: |
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-iamhacked"/' \
            arch/arm64/configs/vendor/lineage-a52q_defconfig
          sed -i 's/^PROTON_VER=.*/PROTON_VER="iamhacked"/' ckbuild.sh
          : > .scmversion
          grep -n "^CONFIG_LOCALVERSION" arch/arm64/configs/vendor/lineage-a52q_defconfig
          grep -n "^PROTON_VER=" ckbuild.sh

      - name: Free up disk space
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true

      - name: Build kernel (KSU + a52q)
        run: |
          chmod +x ckbuild.sh
          export WP="$(pwd)"
          export KBUILD_BUILD_USER="iamhacked"
          export KBUILD_BUILD_HOST="iamhacked"
          bash ckbuild.sh ka52

      - name: Verifikasi CONFIG_KSU
        if: always()
        run: grep -E "CONFIG_KSU" out/.config || echo "!!! CONFIG_KSU TIDAK ADA !!!"

      - name: Upload flashable zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProtonPlusV2-ReSukiSU-a52q
          path: ProtonPlus_*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
          if-no-files-found: ignore
